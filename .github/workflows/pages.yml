# main에 합치면 빌드해서 GitHub Pages에 배포 (개발 계획 T4)
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 동작
# Settings → Secrets and variables → Actions → Variables: VITE_BACKEND, VITE_SUPABASE_URL / Secrets: VITE_SUPABASE_ANON_KEY
name: Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tools/check.mjs --unit
      - run: npm run build
        env:
          VITE_BACKEND: ${{ vars.VITE_BACKEND || 'local' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
